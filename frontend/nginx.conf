server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # API requests are routed by the ALB to the backend service (/api/*).
    # The browser calls /api/v1/... on the same host; nginx only serves the SPA here.

    location / {
        try_files $uri $uri/ /index.html;
    }
}
