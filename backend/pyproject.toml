[project]
name = "simple-blog-backend"
version = "1.0.0"
description = "FastAPI backend for the Simple Blog application"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-multipart==0.0.20",
    "alembic==1.14.0",
]

[tool.uv]
package = false
